name: Portable tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  node:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm test
      - run: node scripts/setup-python.mjs --engine all --dry-run
